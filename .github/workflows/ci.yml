name: evaluation-service CI/CD

on:
  pull_request:
  push:
    branches: [main]
  # Permite disparar o pipeline manualmente pelo botao "Run workflow"
  # na aba Actions, sem precisar de um commit novo.
  workflow_dispatch:

permissions:
  contents: read

env:
  SERVICE_NAME: evaluation-service
  GO_VERSION: '1.27'

jobs:
  build-test:
    name: Build & Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Run unit tests
        run: go test ./... -v

  lint:
    name: Linter / Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m

  security-scan:
    name: Security Scan (SAST & SCA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # SCA: scans go.sum for known-vulnerable dependency versions
      - name: SCA - Trivy filesystem scan (dependency vulnerabilities)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL
          exit-code: 1
          format: table

      # SAST: scans our own source code for insecure patterns
      - name: SAST - gosec (source code vulnerabilities)
        uses: securego/gosec@master
        with:
          args: '-severity high -confidence high ./...'

  docker-build-push:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [build-test, lint, security-scan]
    steps:
      - uses: actions/checkout@v4

      - name: Set short commit SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: docker build -t ${{ env.SERVICE_NAME }}:${{ steps.vars.outputs.sha_short }} .

      - name: Container scan - Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.SERVICE_NAME }}:${{ steps.vars.outputs.sha_short }}
          severity: CRITICAL
          exit-code: 1
          format: table

      # -----------------------------------------------------------------
      # Push para o ECR privado — apenas na main, nunca em Pull Request
      # -----------------------------------------------------------------
      # Executar isto em PR entregaria credenciais AWS a código ainda não
      # revisado, vindo de qualquer branch. O build e o scan acima seguem
      # rodando em PR: só a publicação é restrita.
      - name: Configure AWS credentials
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # Publica somente a tag imutável v1.0.0-<sha>. Não publicamos "latest"
      # de propósito: o repositório ECR é criado com IMMUTABLE, então o
      # segundo push de "latest" seria rejeitado pelo registry.
      - name: Tag & push image to ECR
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: v1.0.0-${{ steps.vars.outputs.sha_short }}
        run: |
          docker tag "${SERVICE_NAME}:${{ steps.vars.outputs.sha_short }}" "${ECR_REGISTRY}/${SERVICE_NAME}:${IMAGE_TAG}"
          docker push "${ECR_REGISTRY}/${SERVICE_NAME}:${IMAGE_TAG}"

      # -----------------------------------------------------------------
      # GitOps: atualiza a tag no repo raiz; o ArgoCD sincroniza sozinho
      # -----------------------------------------------------------------
      # O CI não fala com o cluster. Ele só edita um arquivo no Git — quem
      # aplica no EKS é o ArgoCD, ao detectar o commit.
      #
      # --- GitOps tag update disabled: depends on the ECR push above, still paused too ---
      # once AWS access is back AND the block above is uncommented, remove the leading
      # "# " from every line below to enable it. Needs a repo secret GITOPS_PAT: a GitHub
      # Personal Access Token with write access to the toggle-master-microservices repo
      # (this service's own GITHUB_TOKEN can't push to a DIFFERENT repo, only its own).
      # - name: Checkout GitOps repo
      #   if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      #   uses: actions/checkout@v4
      #   with:
      #     repository: ProjetoFIAPToggleMaster/toggle-master-microservices
      #     token: ${{ secrets.GITOPS_PAT }}
      #     path: gitops-repo
      #
      # - name: Update image tag in GitOps repo
      #   if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      #   env:
      #     IMAGE_TAG: v1.0.0-${{ steps.vars.outputs.sha_short }}
      #   run: |
      #     cd gitops-repo
      #     sed -i "s|\(image: .*/${{ env.SERVICE_NAME }}\):.*|\1:$IMAGE_TAG|" k8s/overlays/prod/patch-images.yaml
      #     git config user.name "github-actions[bot]"
      #     git config user.email "github-actions[bot]@users.noreply.github.com"
      #     git add k8s/overlays/prod/patch-images.yaml
      #     git commit -m "chore: update ${{ env.SERVICE_NAME }} image to $IMAGE_TAG"
      #     git push
      # Precisa do secret GITOPS_PAT: o GITHUB_TOKEN deste repositório só
      # tem permissão sobre ele mesmo, não sobre o repo raiz.
      # 'ref: master' porque o repo raiz usa master (os serviços usam main).
      - name: Checkout GitOps repo
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/checkout@v4
        with:
          repository: ProjetoFIAPToggleMaster/toggle-master-microservices
          ref: master
          token: ${{ secrets.GITOPS_PAT }}
          path: gitops-repo

      - name: Update image tag in GitOps repo
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          IMAGE_TAG: v1.0.0-${{ steps.vars.outputs.sha_short }}
        run: |
          cd gitops-repo
          sed -i -E "s|(image: .*/${SERVICE_NAME}):.*|\1:${IMAGE_TAG}|" k8s/overlays/prod/patch-images.yaml

          # Reexecutar o mesmo commit não muda nada no arquivo, e um
          # 'git commit' sem alterações falharia — então saímos antes.
          if git diff --quiet; then
            echo "patch-images.yaml já aponta para ${IMAGE_TAG}; nada a fazer."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(${SERVICE_NAME}): imagem ${IMAGE_TAG}"
          git push origin master
